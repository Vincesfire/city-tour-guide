<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Steps - Guide Touristique Européen (Tracés piétons intelligents)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #c8102e;
            --secondary: #00247d;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, var(--secondary) 0%, #001240 100%);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .header-content {
            max-width: 1000px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.9;
            margin-bottom: 1.25rem;
        }

        .city-selector-bar {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 0.5rem 1.25rem;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            gap: 10px;
        }

        .city-selector-bar label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .city-selector-bar select {
            background: white;
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .global-map-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            margin-bottom: 2.5rem;
            border: 1px solid var(--border);
        }

        #global-map {
            height: 460px;
            width: 100%;
            border-radius: 8px;
            z-index: 1;
        }

        .filter-bar {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.25rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 1.25rem;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .filter-group select {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: white;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .circuits-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .circuit-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .circuit-header {
            padding: 1.5rem;
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .circuit-badge {
            background: var(--secondary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .circuit-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 0.4rem;
        }

        .circuit-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .circuit-map-container {
            height: 260px;
            width: 100%;
            background: #e2e8f0;
            z-index: 1;
        }

        .steps-container {
            padding: 1.5rem;
        }

        .steps-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--secondary);
        }

        .step-item {
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 1rem;
            overflow: hidden;
            background: white;
        }

        .step-header {
            padding: 1rem;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .step-header:hover {
            background: #f1f5f9;
        }

        .step-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .step-number {
            background: var(--primary);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .step-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
        }

        .step-price-tag {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-weight: 600;
        }

        .price-free {
            background: #dcfce7;
            color: #166534;
        }

        .price-paid {
            background: #fee2e2;
            color: #991b1b;
        }

        .toggle-icon {
            font-size: 1.1rem;
            transition: transform 0.3s;
            color: var(--text-muted);
        }

        .step-item.open .toggle-icon {
            transform: rotate(180deg);
        }

        .step-body {
            display: none;
            padding: 1.25rem;
            border-top: 1px solid var(--border);
            background: white;
        }

        .step-item.open .step-body {
            display: block;
        }

        .step-image {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .audio-player-bar {
            background: #f1f5f9;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
        }

        .audio-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .audio-btn.stop {
            background: #64748b;
        }

        .step-highlights {
            background: #eff6ff;
            border-left: 4px solid var(--secondary);
            padding: 0.8rem 1rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .step-highlights strong {
            color: var(--secondary);
            display: block;
            margin-bottom: 0.2rem;
        }

        .step-description {
            font-size: 0.95rem;
            color: #334155;
            line-height: 1.7;
            text-align: justify;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: var(--radius);
            color: var(--text-muted);
            border: 1px dashed var(--border);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1>🌍 City Steps - 100 Circuits Européens (Routage Piéton)</h1>
            <p>10 circuits par quartier unique avec suivi fidèle des rues et ruelles pittoresques pour chaque métropole.</p>
            
            <div class="city-selector-bar">
                <label for="city-select">📍 Sélectionner une ville :</label>
                <select id="city-select" onchange="changeCity(this.value)">
                    <option value="london">🇬🇧 Londres (10 circuits)</option>
                    <option value="paris">🇫🇷 Paris (10 circuits)</option>
                    <option value="rome">🇮🇹 Rome (10 circuits)</option>
                    <option value="barcelona">🇪🇸 Barcelone (10 circuits)</option>
                    <option value="amsterdam">🇳🇱 Amsterdam (10 circuits)</option>
                    <option value="prague">🇨🇿 Prague (10 circuits)</option>
                    <option value="vienna">🇦🇹 Vienne (10 circuits)</option>
                    <option value="berlin">🇩🇪 Berlin (10 circuits)</option>
                    <option value="florence">🇮🇹 Florence (10 circuits)</option>
                    <option value="venice">🇮🇹 Venise (10 circuits)</option>
                </select>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="section-title" id="global-map-title">📍 Carte globale des circuits</div>
        <div class="global-map-card">
            <div id="global-map"></div>
        </div>

        <div class="filter-bar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Rechercher un lieu, un quartier ou un monument..." oninput="renderApp()">
            </div>
            <div class="filters">
                <div class="filter-group">
                    <label>Durée max :</label>
                    <select id="filter-duration" onchange="renderApp()">
                        <option value="all">Toutes</option>
                        <option value="2h">Jusqu'à 2h00</option>
                        <option value="3h">Jusqu'à 3h00</option>
                        <option value="4h">Jusqu'à 4h00</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Budget :</label>
                    <select id="filter-price" onchange="renderApp()">
                        <option value="all">Tous</option>
                        <option value="free">100% Gratuit</option>
                        <option value="paid">Payant inclus</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="circuits-grid" id="circuits-container"></div>
    </div>

                    const angle = (idx * 0.7) + (i * 1.5);
                    const radius = 0.008 + (i * 0.005);
                    const offsetLat = Math.sin(angle) * radius;
                    const offsetLng = Math.cos(angle) * radius;
                    
                    steps.push({
                        name: `${item.s} ${i > 0 ? '(Étape ' + (i + 1) + ')' : ''}`,
                        coords: [baseLat + offsetLat, baseLng + offsetLng],

        function renderApp() {

            const circuits = generateCityCircuits(currentCityKey);
            initGlobalMap(conf, circuits);

        // Fonction pour récupérer le routage piéton via OSRM (avec fallback sur ligne droite)
        async function fetchPedestrianRoute(latLngs) {
            try {
                // Construction des coordonnées au format lon,lat pour l'API OSRM
                const coordsStr = latLngs.map(pt => `${pt[1]},${pt[0]}`).join(';');
                const url = `https://router.project-osrm.org/route/v1/foot/${coordsStr}?overview=full&geometries=geojson`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    // OSRM renvoie [lon, lat], Leaflet a besoin de [lat, lon]
                    return data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
                }
            } catch (e) {
                console.warn("Routage OSRM indisponible, utilisation du tracé direct.", e);
            }
            return latLngs; // Fallback
        }

        async function initGlobalMap(conf, circuits) {
            if (globalMap) {
                globalMap.remove();
            }

            globalMap = L.map('global-map').setView(conf.center, conf.zoom);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(globalMap);

            for (const circuit of circuits) {
                const rawLatLngs = circuit.steps.map(s => s.coords);
                const routedLatLngs = await fetchPedestrianRoute(rawLatLngs);

                L.polyline(routedLatLngs, {
                    color: circuit.color,
                    weight: 4,
                    opacity: 0.85,
                    dashArray: '6, 6'
                }).addTo(globalMap);

                circuit.steps.forEach((step, idx) => {
                    L.circleMarker(step.coords, {
                        radius: 6,
                        fillColor: circuit.color,
                        color: '#ffffff',
                        weight: 2,
                        fillOpacity: 0.9
                    }).addTo(globalMap).bindPopup(`<b>${circuit.title}</b><br>${idx + 1}. ${step.name}`);
                });
            }
        }

        async function renderCircuitsGrid(conf, circuits) {
            const container = document.getElementById('circuits-container');
            container.innerHTML = '';

            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const durationFilter = document.getElementById('filter-duration').value;
            const priceFilter = document.getElementById('filter-price').value;

            const filtered = circuits.filter(circuit => {
                const matchSearch = circuit.title.toLowerCase().includes(searchTerm) ||
                    circuit.district.toLowerCase().includes(searchTerm) ||
                    circuit.steps.some(s => s.name.toLowerCase().includes(searchTerm));

                if (!matchSearch) return false;
                if (durationFilter === '2h' && circuit.durationHours > 2.0) return false;
                if (durationFilter === '3h' && circuit.durationHours > 3.0) return false;
                if (durationFilter === '4h' && circuit.durationHours > 4.0) return false;
                if (priceFilter === 'free' && circuit.hasPaid) return false;
                if (priceFilter === 'paid' && !circuit.hasPaid) return false;

                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><h3>Aucun circuit ne correspond à vos critères pour ${conf.name}.</h3></div>`;
                return;
            }

            filtered.forEach(circuit => {
                const card = document.createElement('div');
                card.className = 'circuit-card';
                card.id = `card-${circuit.id}`;

                let stepsHTML = circuit.steps.map((step, idx) => `
                    <div class="step-item" id="step-${circuit.id}-${idx}">
                        <div class="step-header" onclick="toggleStep('${circuit.id}', ${idx})">
                            <div class="step-header-left">
                                <span class="step-number">${idx + 1}</span>
                                <span class="step-name">${step.name}</span>
                                <span class="step-price-tag ${step.isFree ? 'price-free' : 'price-paid'}">${step.price}</span>
                            </div>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="step-body">
                            <img src="${step.image}" alt="${step.name}" class="step-image" loading="lazy">
                            
                            <div class="audio-player-bar">
                                <span>🎧 <strong>Guide Vocal Parlé</strong></span>
                                <div>
                                    <button class="audio-btn" onclick="playAudio('${step.name}', '${step.highlights}. ${step.description}')">🔊 Écouter</button>
                                    <button class="audio-btn stop" onclick="stopAudio()">⏹️ Stopper</button>
                                </div>
                            </div>

                            <div class="step-highlights">
                                <strong>💡 À ne pas manquer :</strong>
                                ${step.highlights}
                            </div>
                            <div class="step-description">
                                ${step.description}
                            </div>
                        </div>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="circuit-header">
                        <div>
                            <span class="circuit-badge">${circuit.district}</span>
                            <h2 class="circuit-title">${circuit.title}</h2>
                            <div class="circuit-meta">
                                <span>⏱️ ${circuit.duration}</span>
                                <span>🚶 ${circuit.distance}</span>
                                <span>📊 ${circuit.difficulty}</span>
                            </div>
                        </div>
                    </div>
                    <div class="circuit-map-container" id="map-${circuit.id}"></div>
                    <div class="steps-container">
                        <div class="steps-title">📍 Étapes détaillées du quartier :</div>
                        ${stepsHTML}
                    </div>
                `;
                container.appendChild(card);
            });

            setTimeout(() => {
                filtered.forEach(circuit => initIndividualMap(circuit));
            }, 100);
        }

        async function initIndividualMap(circuit) {
            const mapId = `map-${circuit.id}`;
            const mapElem = document.getElementById(mapId);
            if (!mapElem) return;

            if (mapInstances[mapId]) {
                mapInstances[mapId].remove();
            }

            const rawLatLngs = circuit.steps.map(s => s.coords);
            const map = L.map(mapId, { scrollWheelZoom: false }).setView(rawLatLngs[0], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            const routedLatLngs = await fetchPedestrianRoute(rawLatLngs);

            L.polyline(routedLatLngs, { color: circuit.color, weight: 5, opacity: 0.9 }).addTo(map);

            circuit.steps.forEach((step, idx) => {
                const pin = L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background:${circuit.color};color:white;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-weight:bold;font-size:11px;border:2px solid white;">${idx + 1}</div>`,
                    iconSize: [22, 22],
                    iconAnchor: [11, 11]
                });
                L.marker(step.coords, { icon: pin }).addTo(map).bindPopup(`<b>${idx + 1}. ${step.name}</b>`);
            });

            map.fitBounds(L.polyline(routedLatLngs).getBounds(), { padding: [25, 25] });
            mapInstances[mapId] = map;
        }

        function toggleStep(circuitId, idx) {
            document.getElementById(`step-${circuitId}-${idx}`).classList.toggle('open');
        }

        function playAudio(title, desc) {
            stopAudio();
            if ('speechSynthesis' in window) {
                currentUtterance = new SpeechSynthesisUtterance(`${title}. ${desc}`);
                currentUtterance.lang = 'fr-FR';
                currentUtterance.rate = 0.95;
                synth.speak(currentUtterance);
            }
        }

        function stopAudio() {
            if (synth && synth.speaking) synth.cancel();
        }
    </script>
</body>
</html>
