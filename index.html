    /**
     * UTILITAIRE DE NOTIFICATION NON-BLOQUANTE (TOAST)
     */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        info: 'bg-slate-900/95 text-white border-slate-700',
        success: 'bg-emerald-900/95 text-emerald-50 border-emerald-700',
        warning: 'bg-amber-900/95 text-amber-50 border-amber-700',
        error: 'bg-rose-900/95 text-rose-50 border-rose-700'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl border shadow-lg text-xs font-semibold backdrop-blur-sm transition-all duration-300 ${styles[type] || styles.info}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-6px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function initMap() {
      if (typeof L === 'undefined') {

          const idx = TILE_PROVIDERS.findIndex(p => p.key === (manualTileMode === 'auto' ? 'osm-standard' : manualTileMode));

    function updateTileSourceBadge(label, statusColor = 'bg-emerald-400') {

    function activateVectorFallback(enable) {
      vectorFallbackActive = enable;
      const canvas = document.getElementById('vector-fallback-canvas');
      if (!canvas) return;

      if (enable) {
        canvas.style.display = 'block';
        drawVectorFallbackMap();
        updateTileSourceBadge('Mode Radar GPS Hors-Ligne', 'bg-amber-400');
      } else {
        canvas.style.display = 'none';
        if (map) setTimeout(() => map.invalidateSize(), 60);
      }
    }

    function loadTileProviderByIndex(index, visitedIndices = new Set()) {
      if (!map) return;

      if (!navigator.onLine) {
        activateVectorFallback(true);
        return;
      }

      if (index < 0 || index >= TILE_PROVIDERS.length) {
        activateVectorFallback(true);
        showToast('Serveurs de tuiles injoignables : Mode Radar GPS activé.', 'warning');
        return;
      }

      const provider = TILE_PROVIDERS[index];
      visitedIndices.add(index);
      activeTileProviderKey = provider.key;

      if (currentTileLayer) {
        map.removeLayer(currentTileLayer);
        currentTileLayer = null;
      }

      let errorCount = 0;
      let loadedCount = 0;
      let fallbackTriggered = false;

      const triggerNextProvider = (reason) => {
        if (fallbackTriggered) return;
        fallbackTriggered = true;

        // En mode manuel strict (sauf osm-standard initial et auto), basculer vers le radar ou le suivant
        const nextIndex = TILE_PROVIDERS.findIndex((_, i) => !visitedIndices.has(i));
        if (nextIndex !== -1) {
          showToast(`${provider.name} indisponible (${reason}) → bascule vers ${TILE_PROVIDERS[nextIndex].name}...`, 'info');
          loadTileProviderByIndex(nextIndex, visitedIndices);
        } else {
          activateVectorFallback(true);
          showToast('Tuiles bloquées par le réseau : Mode Radar GPS Hors-Ligne activé.', 'warning');
        }
      };

      updateTileSourceBadge(`Carte : ${provider.name}`, 'bg-sky-400 animate-pulse');

      // Garde-fou délai : si aucune tuile n'arrive sous 5s, basculer automatiquement
      const slowTimeout = setTimeout(() => {
        if (loadedCount === 0) {
          triggerNextProvider('délai dépassé');
        }
      }, 5000);

      const layer = L.tileLayer(provider.url, provider.options);

      layer.on('tileload', () => {
        loadedCount++;
        if (loadedCount === 1) {
          clearTimeout(slowTimeout);
          if (manualTileMode !== 'vector-radar') {
            activateVectorFallback(false);
          }
          updateTileSourceBadge(`Carte : ${provider.name}`, 'bg-emerald-400');
        }
      });

      layer.on('tileerror', () => {
        errorCount++;
        if (errorCount >= 4 && loadedCount === 0) {
          clearTimeout(slowTimeout);
          triggerNextProvider('erreur réseau');
        }
      });

      layer.addTo(map);
      currentTileLayer = layer;
    }

    function handleManualTileSourceChange(selectedValue) {

      if (selectedValue === 'vector-radar') {
        activateVectorFallback(true);

      if (selectedValue === 'auto' || selectedValue === 'osm-standard') {
        loadTileProviderByIndex(0, new Set());
        showToast('Chargement d’OpenStreetMap Standard...', 'info');
        return;
      }

      const idx = TILE_PROVIDERS.findIndex(p => p.key === selectedValue);
      if (idx !== -1) {
        loadTileProviderByIndex(idx, new Set());
      }
    }

    /**
     * CARTE VECTORIELLE / RADAR INTERACTIVE (100% HORS-LIGNE / SANS TUILES EXTERNES)
     */
    function initVectorFallbackCanvas() {
      const canvas = document.getElementById('vector-fallback-canvas');
      if (!canvas) return;

      canvas.addEventListener('click', (e) => {
        if (!vectorFallbackActive) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        const circuit = CIRCUITS.find(c => c.id === currentCircuitId);
        if (!circuit || !circuit.pois.length) return;

        const projected = projectCircuitPoints(circuit, rect.width, rect.height);
        let closestIdx = -1;
        let bestDist = 36;

        projected.forEach((pt, idx) => {
          const d = Math.hypot(clickX - pt.x, clickY - pt.y);
          if (d < bestDist) {
            bestDist = d;
            closestIdx = idx;
          }
        });

        if (closestIdx !== -1) {
          const poi = circuit.pois[closestIdx];
          playPoiAudio(poi.id);
          showToast(`Étape ${closestIdx + 1} : ${poi.name}`, 'info');
        }
      });
    }

    function projectCircuitPoints(circuit, width, height) {
      const points = [...circuit.pois.map(p => ({ lat: p.lat, lng: p.lng }))];
      if (circuit.streetWaypoints) {
        circuit.streetWaypoints.forEach(w => points.push({ lat: w[0], lng: w[1] }));
      }
      if (lastUserCoords) {
        points.push({ lat: lastUserCoords.lat, lng: lastUserCoords.lng });
      }

      let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
      points.forEach(pt => {
        if (pt.lat < minLat) minLat = pt.lat;
        if (pt.lat > maxLat) maxLat = pt.lat;
        if (pt.lng < minLng) minLng = pt.lng;
        if (pt.lng > maxLng) maxLng = pt.lng;
      });

      const latSpan = Math.max(maxLat - minLat, 0.005);
      const lngSpan = Math.max(maxLng - minLng, 0.005);
      const padX = 56;
      const padY = 68;
      const usableW = Math.max(100, width - padX * 2);
      const usableH = Math.max(100, height - padY * 2);

      const cosLat = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
      const scaledLngSpan = lngSpan * cosLat;
      const scale = Math.min(usableW / scaledLngSpan, usableH / latSpan);

      const totalW = scaledLngSpan * scale;
      const totalH = latSpan * scale;
      const offsetX = padX + (usableW - totalW) / 2;
      const offsetY = padY + (usableH - totalH) / 2;

      const toXY = (lat, lng) => ({
        x: offsetX + ((lng - minLng) * cosLat) * scale,
        y: offsetY + (maxLat - lat) * scale
      });

      return circuit.pois.map((poi, idx) => ({
        ...poi,
        idx,
        ...toXY(poi.lat, poi.lng)
      }));
    }

    function drawVectorFallbackMap() {
      const canvas = document.getElementById('vector-fallback-canvas');
      if (!canvas || !vectorFallbackActive) return;

      const parent = canvas.parentElement;
      const width = parent ? parent.clientWidth : 600;
      const height = parent ? parent.clientHeight : 420;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.scale(dpr, dpr);

      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#0f172a');
      bgGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.12)';
      ctx.lineWidth = 1;
      const step = 36;
      for (let x = 0; x <= width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y <= height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      const circuit = CIRCUITS.find(c => c.id === currentCircuitId);
      if (!circuit) {
        ctx.restore();
        return;
      }

      const allPts = [...circuit.pois.map(p => ({ lat: p.lat, lng: p.lng }))];
      if (circuit.streetWaypoints) {
        circuit.streetWaypoints.forEach(w => allPts.push({ lat: w[0], lng: w[1] }));
      }
      if (lastUserCoords) allPts.push({ lat: lastUserCoords.lat, lng: lastUserCoords.lng });

      let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
      allPts.forEach(pt => {
        if (pt.lat < minLat) minLat = pt.lat;
        if (pt.lat > maxLat) maxLat = pt.lat;
        if (pt.lng < minLng) minLng = pt.lng;
        if (pt.lng > maxLng) maxLng = pt.lng;
      });

      const latSpan = Math.max(maxLat - minLat, 0.005);
      const lngSpan = Math.max(maxLng - minLng, 0.005);
      const padX = 56;
      const padY = 68;
      const usableW = Math.max(100, width - padX * 2);
      const usableH = Math.max(100, height - padY * 2);
      const cosLat = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
      const scaledLngSpan = lngSpan * cosLat;
      const scale = Math.min(usableW / scaledLngSpan, usableH / latSpan);
      const totalW = scaledLngSpan * scale;
      const totalH = latSpan * scale;
      const offsetX = padX + (usableW - totalW) / 2;
      const offsetY = padY + (usableH - totalH) / 2;

      const toXY = (lat, lng) => ({
        x: offsetX + ((lng - minLng) * cosLat) * scale,
        y: offsetY + (maxLat - lat) * scale
      });

      const fallbackStreetCoords = circuit.streetWaypoints || circuit.pois.map(p => [p.lat, p.lng]);
      const pathSource = currentRouteCoords.length > 1
        ? currentRouteCoords.map(c => toXY(c[0], c[1]))
        : fallbackStreetCoords.map(c => toXY(c[0], c[1]));

      if (pathSource.length > 1) {
        ctx.beginPath();
        ctx.moveTo(pathSource[0].x, pathSource[0].y);
        for (let i = 1; i < pathSource.length; i++) {
          ctx.lineTo(pathSource[i].x, pathSource[i].y);
        }
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }

      const projectedPois = circuit.pois.map((poi, idx) => ({ ...poi, idx, ...toXY(poi.lat, poi.lng) }));
      projectedPois.forEach(pt => {
        const isVisited = visitedPois.has(pt.id);
        const isActive = activePoi && activePoi.id === pt.id;

        ctx.beginPath();
        ctx.arc(pt.x, pt.y, isActive ? 16 : 13, 0, Math.PI * 2);
        ctx.fillStyle = isActive ? '#ef4444' : isVisited ? '#10b981' : '#1d4ed8';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(pt.idx + 1), pt.x, pt.y + 0.5);

        ctx.font = '600 11px Inter, sans-serif';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(pt.name, pt.x, pt.y - 20);
      });

      if (lastUserCoords) {
        const uPt = toXY(lastUserCoords.lat, lastUserCoords.lng);
        ctx.beginPath();
        ctx.arc(uPt.x, uPt.y, 16, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(59, 130, 246, 0.25)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(uPt.x, uPt.y, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#60a5fa';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.fillStyle = '#93c5fd';
        ctx.fillText('VOUS', uPt.x, uPt.y + 18);
      }

      ctx.restore();
    }

    /**
     * MISE À JOUR DES MARQUEURS ET DU TRACÉ PÉDESTRE OSRM (AVEC REPLI RUES DE LONDRES)
     */
    async function updateMapForCircuit(circuit) {
      const fallbackStreetCoords = circuit.streetWaypoints || circuit.pois.map(p => [p.lat, p.lng]);
      currentRouteCoords = fallbackStreetCoords;

      if (!map) {
        if (vectorFallbackActive) drawVectorFallbackMap();
        return;
      }

      map.invalidateSize();

      // Nettoyage des anciens marqueurs et tracés
      poiMarkers.forEach(m => map.removeLayer(m));
      poiMarkers = [];
      if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
      }

      const latLngs = [];

      circuit.pois.forEach((poi, idx) => {
        const isVisited = visitedPois.has(poi.id);
        const isActive = activePoi && activePoi.id === poi.id;
        const markerClass = isActive ? 'active' : isVisited ? 'visited' : 'default';

        const icon = L.divIcon({
          className: '',
          html: `<div class="poi-marker ${markerClass}">${idx + 1}</div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15],
          popupAnchor: [0, -14]
        });

        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${poi.lat},${poi.lng}&travelmode=walking`;
        const popupHtml = `
          <div class="min-w-[190px]">
            <p class="text-[10px] font-extrabold uppercase text-blue-700">Étape ${idx + 1}</p>
            <h5 class="font-extrabold text-sm text-slate-900 mt-0.5">${poi.name}</h5>
            <p class="text-xs text-slate-600 mt-0.5">${poi.subtitle}</p>
            <div class="mt-2.5 flex items-center gap-1.5">
              <button onclick="playPoiAudio('${poi.id}')" class="px-2.5 py-1.5 rounded-lg bg-red-600 text-white text-xs font-bold">
                ▶ Écouter (2 min)
              </button>
              <a href="${gmapsUrl}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-800 text-xs font-semibold">
                Maps ↗
              </a>
            </div>
          </div>
        `;

        const marker = L.marker([poi.lat, poi.lng], { icon })
          .addTo(map)
          .bindPopup(popupHtml);

        poiMarkers.push(marker);
        latLngs.push([poi.lat, poi.lng]);
      });

      // Ajuster la vue de la carte sur l'ensemble des étapes
      if (latLngs.length > 0) {
        const bounds = L.latLngBounds(fallbackStreetCoords);
        map.fitBounds(bounds, { padding: [45, 45], maxZoom: 15 });
      }

      // Appel à l'API publique OSRM pour le tracé pédestre réel
      const modeBadge = document.getElementById('routing-mode-badge');
      modeBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Calcul du tracé piéton OSRM...`;

      try {
        const coordsString = circuit.pois.map(p => `${p.lng},${p.lat}`).join(';');
        const url = `https://router.project-osrm.org/route/v1/foot/${coordsString}?overview=full&geometries=geojson`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error('Erreur réseau OSRM');
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const geojsonCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          currentRouteCoords = geojsonCoords;
          routeLayer = L.polyline(geojsonCoords, {
            color: '#1d4ed8',
            weight: 5,
            opacity: 0.88,
            lineJoin: 'round'
          }).addTo(map);

          modeBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Tracé pédestre OSRM actif`;
        } else {
          throw new Error('Aucun itinéraire retourné');
        }
      } catch (err) {
        // Repli fidèle sur les rues de Londres pré-encodées
        currentRouteCoords = fallbackStreetCoords;
        routeLayer = L.polyline(fallbackStreetCoords, {
          color: '#dc2626',
          weight: 4.5,
          opacity: 0.85,
          dashArray: '8, 6',
          lineJoin: 'round'
        }).addTo(map);

        modeBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Tracé rues intégré (hors-ligne)`;
      }

      if (vectorFallbackActive) {
        drawVectorFallbackMap();
      }
    }

    function fitCircuitBounds() {
      const circuit = CIRCUITS.find(c => c.id === currentCircuitId);
      if (!circuit) return;
      if (map) {
        map.invalidateSize();
        const bounds = L.latLngBounds(circuit.streetWaypoints || circuit.pois.map(p => [p.lat, p.lng]));
        map.fitBounds(bounds, { padding: [45, 45], maxZoom: 15 });
      }
      if (vectorFallbackActive) drawVectorFallbackMap();
    }

    function zoomToPoi(poiId) {
      const circuit = CIRCUITS.find(c => c.id === currentCircuitId);
      const idx = circuit.pois.findIndex(p => p.id === poiId);
      if (idx === -1) return;
      const poi = circuit.pois[idx];

      switchMobileTab('map');
      setTimeout(() => {
        if (map) {
          map.invalidateSize();
          map.setView([poi.lat, poi.lng], 16, { animate: true });
          if (poiMarkers[idx]) {
            poiMarkers[idx].openPopup();
          }
        }
        if (vectorFallbackActive) drawVectorFallbackMap();
      }, 100);
    }

    function focusAndPlayPoi(poiId) {
      const circuit = CIRCUITS.find(c => c.id === currentCircuitId);
      const idx = circuit.pois.findIndex(p => p.id === poiId);
      if (idx === -1) return;
      const poi = circuit.pois[idx];

      if (map) {
        map.setView([poi.lat, poi.lng], 16, { animate: true });
        if (poiMarkers[idx]) poiMarkers[idx].openPopup();
      }
      playPoiAudio(poiId);
    }

    /**
     * GESTION DES ÉTAPES VISITÉES (localStorage)
     */
    function togglePoiVisited(poiId) {
      if (visitedPois.has(poiId)) {
        visitedPois.delete(poiId);
      } else {
        visitedPois.add(poiId);
        showToast('Étape marquée comme visitée !', 'success');
      }
      saveVisitedPois();

      const circuit = CIRCUITS.find(c => c.id === currentCircuitId);
      updateProgressBadge(circuit);
      renderMapPoiPills(circuit);
      renderPoiCards(circuit);
      updateMapForCircuit(circuit);
    }

    function resetVisitedForCurrentCircuit() {
      const circuit = CIRCUITS.find(c => c.id === currentCircuitId);
      circuit.pois.forEach(p => visitedPois.delete(p.id));
      saveVisitedPois();
      updateProgressBadge(circuit);
      renderMapPoiPills(circuit);
      renderPoiCards(circuit);
      updateMapForCircuit(circuit);
      showToast('Progression du circuit réinitialisée.', 'info');
    }

    /**
     * NAVIGATION PAR ONGLETS SUR MOBILE
     */
    function switchMobileTab(tabName) {
      const panels = {
        map: document.getElementById('panel-map'),
        route: document.getElementById('panel-route'),
        audio: document.getElementById('panel-audio')
      };
      const buttons = {
        map: document.getElementById('tab-btn-map'),
        route: document.getElementById('tab-btn-route'),
        audio: document.getElementById('tab-btn-audio')
      };

      Object.keys(panels).forEach(key => {
        if (key === tabName) {
          panels[key].classList.remove('hidden');
          buttons[key].classList.add('border-blue-700', 'text-blue-700', 'bg-white');
          buttons[key].classList.remove('border-transparent', 'text-slate-600');
        } else {
          panels[key].classList.add('hidden');
          buttons[key].classList.remove('border-blue-700', 'text-blue-700', 'bg-white');
          buttons[key].classList.add('border-transparent', 'text-slate-600');
        }
      });

      if (tabName === 'map') {
        setTimeout(() => {
          if (map) map.invalidateSize();
          if (vectorFallbackActive) drawVectorFallbackMap();
        }, 80);
      }
    }

    /**
     * LECTEUR AUDIOGUIDE (SYNTHÈSE VOCALE NATIVE fr-FR DÉCOUPÉE PAR PHRASES POUR iOS/ANDROID)
     */
    function findPoiById(poiId) {
      for (const c of CIRCUITS) {
        const found = c.pois.find(p => p.id === poiId);
        if (found) return found;
      }
      return null;
    }

    function getFrenchVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      return (
        voices.find(v => v.lang === 'fr-FR' && (v.name.includes('Google') || v.name.includes('Thomas') || v.name.includes('Amélie') || v.name.includes('Natural'))) ||
        voices.find(v => v.lang.startsWith('fr')) ||
        null
      );
    }

    function splitTextIntoChunks(text) {
      // Découpe par phrases pour éviter le bug de coupure après ~15 secondes sur Chrome/Android/Safari
      const sentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
      return sentences.map(s => s.trim()).filter(Boolean);
    }

    function playNextSpeechChunk() {
      if (!isSpeaking || isPaused) return;
      if (currentChunkIndex >= speechQueue.length) {
        isSpeaking = false;
        isPaused = false;
        clearInterval(progressTimer);
        document.getElementById('audio-progress-fill').style.width = '100%';
        updatePlayerUI();
        refreshCurrentCircuitLists();
        return;
      }

      const chunk = speechQueue[currentChunkIndex];
      const utterance = new SpeechSynthesisUtterance(chunk);
      utterance.lang = 'fr-FR';
      utterance.rate = speechRates[currentRateIndex];
      const frVoice = getFrenchVoice();
      if (frVoice) utterance.voice = frVoice;

      utterance.onend = () => {
        if (isSpeaking && !isPaused) {
          currentChunkIndex++;
          playNextSpeechChunk();
        }
      };

      utterance.onerror = (e) => {
        if (e.error === 'interrupted' || e.error === 'canceled') return;
        isSpeaking = false;
        isPaused = false;
        clearInterval(progressTimer);
        updatePlayerUI();
      };

      window.speechSynthesis.speak(utterance);
    }

    function playPoiAudio(poiId) {
      if (!('speechSynthesis' in window)) {
        showToast("La synthèse vocale n'est pas supportée sur ce navigateur.", 'error');
        return;
      }

      const poi = findPoiById(poiId);
      if (!poi) return;

      window.speechSynthesis.cancel();
      clearInterval(progressTimer);

      activePoi = poi;
      isSpeaking = true;
      isPaused = false;
      elapsedSeconds = 0;

      const fullText = `${poi.name}. ${poi.audioText}`;
      speechQueue = splitTextIntoChunks(fullText);
      currentChunkIndex = 0;

      const wordCount = fullText.split(/\s+/).length;
      const rate = speechRates[currentRateIndex];
      estimatedTotalSeconds = Math.max(30, Math.round((wordCount / 145) * 60 / rate));

      document.getElementById('audio-progress-fill').style.width = '0%';
      updatePlayerUI();
      refreshCurrentCircuitLists();
      startProgressTimer();
      playNextSpeechChunk();
    }

    function playAdjacentPoi(delta) {
      const circuit = CIRCUITS.find(c => c.id === currentCircuitId);
      if (!circuit || !circuit.pois.length) return;

      if (!activePoi) {
        playPoiAudio(circuit.pois[0].id);
        return;
      }

      const idx = circuit.pois.findIndex(p => p.id === activePoi.id);
      const nextIdx = (idx + delta + circuit.pois.length) % circuit.pois.length;
      focusAndPlayPoi(circuit.pois[nextIdx].id);
    }

    function togglePlayPauseAudio() {
      if (!activePoi) {
        const circuit = CIRCUITS.find(c => c.id === currentCircuitId);
        if (circuit && circuit.pois.length > 0) {
          playPoiAudio(circuit.pois[0].id);
        }
        return;
      }

      if (isSpeaking && !isPaused) {
        window.speechSynthesis.pause();
        isPaused = true;
        clearInterval(progressTimer);
        updatePlayerUI();
      } else if (isPaused) {
        window.speechSynthesis.resume();
        isPaused = false;
        startProgressTimer();
        updatePlayerUI();
      } else {
        playPoiAudio(activePoi.id);
      }
    }

    function stopAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      isPaused = false;
      elapsedSeconds = 0;
      speechQueue = [];
      currentChunkIndex = 0;
      clearInterval(progressTimer);
      document.getElementById('audio-progress-fill').style.width = '0%';
      updatePlayerUI();
      refreshCurrentCircuitLists();
    }

    function cycleSpeechRate() {
      currentRateIndex = (currentRateIndex + 1) % speechRates.length;
      const newRate = speechRates[currentRateIndex];
      document.getElementById('btn-speed').textContent = `${newRate.toFixed(1)}x`;
      showToast(`Vitesse audio : ${newRate.toFixed(1)}x`, 'info');

      if (activePoi && isSpeaking) {
        playPoiAudio(activePoi.id);
      }
    }

    function startProgressTimer() {
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        if (!isPaused && isSpeaking) {
          elapsedSeconds++;
          const pct = Math.min(98, Math.round((elapsedSeconds / estimatedTotalSeconds) * 100));
          document.getElementById('audio-progress-fill').style.width = `${pct}%`;
          document.getElementById('player-time-est').textContent = `${formatTime(elapsedSeconds)} / ~${formatTime(estimatedTotalSeconds)}`;
        }
      }, 1000);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updatePlayerUI() {
      const titleEl = document.getElementById('player-poi-title');
      const statusEl = document.getElementById('player-status-badge');
      const timeEl = document.getElementById('player-time-est');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const labelBtn = document.getElementById('label-play-pause');

      if (!activePoi) {
        titleEl.textContent = 'Sélectionnez un monument à écouter';
        statusEl.textContent = 'Prêt';
        timeEl.textContent = '0:00 / ~2:00';
        iconPlay.classList.remove('hidden');
        iconPause.classList.add('hidden');
        labelBtn.textContent = 'Écouter';
        return;
      }

      titleEl.textContent = activePoi.name;
      timeEl.textContent = `${formatTime(elapsedSeconds)} / ~${formatTime(estimatedTotalSeconds)}`;

      if (isSpeaking && !isPaused) {
        statusEl.textContent = 'En cours';
        statusEl.className = 'px-1.5 py-0.5 rounded bg-red-600/30 text-[10px] font-bold uppercase text-red-300';
        iconPlay.classList.add('hidden');
        iconPause.classList.remove('hidden');
        labelBtn.textContent = 'Pause';
      } else if (isPaused) {
        statusEl.textContent = 'En pause';
        statusEl.className = 'px-1.5 py-0.5 rounded bg-amber-500/20 text-[10px] font-bold uppercase text-amber-300';
        iconPlay.classList.remove('hidden');
        iconPause.classList.add('hidden');
        labelBtn.textContent = 'Reprendre';
      } else {
        statusEl.textContent = 'Terminé';
        statusEl.className = 'px-1.5 py-0.5 rounded bg-slate-800 text-[10px] font-bold uppercase text-slate-300';
        iconPlay.classList.remove('hidden');
        iconPause.classList.add('hidden');
        labelBtn.textContent = 'Réécouter';
      }
    }

    function refreshCurrentCircuitLists() {
      const circuit = CIRCUITS.find(c => c.id === currentCircuitId);
      if (circuit) {
        renderMapPoiPills(circuit);
        renderPoiCards(circuit);
      }
    }

    /**
     * GÉOLOCALISATION GPS TEMPS RÉEL & CALCUL DE DISTANCE HAVERSINE
     */
    function toggleGpsTracking() {
      if (isGpsActive) {
        stopGpsTracking();
      } else {
        startGpsTracking();
      }
    }

    function startGpsTracking() {
      if (!('geolocation' in navigator)) {
        showToast("La géolocalisation GPS n'est pas disponible sur cet appareil.", 'error');
        return;
      }

      isGpsActive = true;
      document.getElementById('gps-btn-label').textContent = 'GPS Actif';
      document.getElementById('btn-gps-toggle').classList.replace('bg-blue-600', 'bg-emerald-600');
      document.getElementById('btn-gps-toggle').classList.replace('hover:bg-blue-500', 'hover:bg-emerald-500');
      document.getElementById('gps-status-bar').classList.remove('hidden');

      showToast('Recherche de votre position GPS...', 'info');

      gpsWatchId = navigator.geolocation.watchPosition(
        onGpsSuccess,
        onGpsError,
        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 15000
        }
      );
    }

    function stopGpsTracking() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
      isGpsActive = false;
      document.getElementById('gps-btn-label').textContent = 'GPS Off';
      document.getElementById('btn-gps-toggle').classList.replace('bg-emerald-600', 'bg-blue-600');
      document.getElementById('btn-gps-toggle').classList.replace('hover:bg-emerald-500', 'hover:bg-blue-500');
      document.getElementById('gps-status-bar').classList.add('hidden');

      if (userMarker && map) {
        map.removeLayer(userMarker);
        userMarker = null;
      }
      if (userAccuracyCircle && map) {
        map.removeLayer(userAccuracyCircle);
        userAccuracyCircle = null;
      }
    }

    function onGpsSuccess(position) {
      const { latitude, longitude, accuracy } = position.coords;
      lastUserCoords = { lat: latitude, lng: longitude };
      if (vectorFallbackActive) drawVectorFallbackMap();

      if (map) {
        if (!userMarker) {
          const userIcon = L.divIcon({
            className: '',
            html: '<div class="gps-user-dot"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
          });
          userMarker = L.marker([latitude, longitude], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
          userAccuracyCircle = L.circle([latitude, longitude], {
            radius: accuracy,
            color: '#2563eb',
            fillColor: '#3b82f6',
            fillOpacity: 0.12,
            weight: 1
          }).addTo(map);

          map.setView([latitude, longitude], 16);
        } else {
          userMarker.setLatLng([latitude, longitude]);
          userAccuracyCircle.setLatLng([latitude, longitude]);
          userAccuracyCircle.setRadius(accuracy);
        }
      }

      document.getElementById('gps-accuracy-badge').textContent = `Précision : ±${Math.round(accuracy)} m`;

      const circuit = CIRCUITS.find(c => c.id === currentCircuitId);
      if (!circuit) return;

      let targetPoi = null;
      let minDistance = Infinity;

      circuit.pois.forEach(poi => {
        const dist = calculateHaversineMeters(latitude, longitude, poi.lat, poi.lng);
        if (dist < minDistance) {
          minDistance = dist;
          targetPoi = poi;
        }

        if (autoAudioEnabled && dist <= 50 && !autoTriggeredPois.has(poi.id) && !isSpeaking) {
          autoTriggeredPois.add(poi.id);
          showToast(`Approche détectée (${Math.round(dist)} m) : lancement de ${poi.name}`, 'success');
          playPoiAudio(poi.id);
        }
      });

      if (targetPoi) {
        const formattedDist = minDistance >= 1000
          ? `${(minDistance / 1000).toFixed(2)} km`
          : `${Math.round(minDistance)} m`;
        document.getElementById('gps-nearest-text').innerHTML =
          `Proche de <strong>${targetPoi.name}</strong> : <span class="underline font-bold">${formattedDist}</span>`;
      }
    }

    function onGpsError(err) {
      let msg = 'Signal GPS indisponible.';
      if (err.code === 1) msg = 'Autorisation GPS refusée. Activez la localisation dans votre navigateur.';
      if (err.code === 2) msg = 'Position introuvable (vérifiez le GPS de votre téléphone).';
      if (err.code === 3) msg = 'Délai dépassé pour le signal GPS.';
      showToast(msg, 'warning');
      document.getElementById('gps-nearest-text').textContent = msg;
    }

    function centerMapOnUser() {
      if (lastUserCoords) {
        switchMobileTab('map');
        if (map) {
          map.setView([lastUserCoords.lat, lastUserCoords.lng], 16, { animate: true });
        }
        if (vectorFallbackActive) drawVectorFallbackMap();
      } else {
        showToast('Position GPS en attente...', 'info');
      }
    }

    function toggleAutoAudio() {
      autoAudioEnabled = !autoAudioEnabled;
      const dot = document.getElementById('auto-audio-dot');
      const btn = document.getElementById('btn-auto-audio');

      if (autoAudioEnabled) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
        btn.classList.add('border-emerald-500', 'text-emerald-300');
        showToast('Déclenchement audio automatique activé (< 50 m d’un monument).', 'success');
        if (!isGpsActive) startGpsTracking();
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-slate-400';
        btn.classList.remove('border-emerald-500', 'text-emerald-300');
        showToast('Déclenchement audio automatique désactivé.', 'info');
      }
    }

    /**
     * FORMULE DE HAVERSINE (distance en mètres entre deux points GPS)
     */
    function calculateHaversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        getFrenchVoice();
      };
    }

    window.onload = function () {
      initMap();
      selectCircuit(1);
    };
  </script>
