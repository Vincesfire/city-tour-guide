<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Steps - Circuits touristiques en Europe</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #c8102e;
            --primary-dark: #9b0b21;
            --secondary: #00247d;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        /* Header & Navigation */
        header {
            background: linear-gradient(135deg, var(--secondary) 0%, #001240 100%);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .header-content {
            max-width: 1000px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.9;
            margin-bottom: 1.25rem;
        }

        /* Sélecteur de ville stylisé */
        .city-selector-bar {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            gap: 10px;
        }

        .city-selector-bar label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .city-selector-bar select {
            background: white;
            color: var(--text);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        /* Container Main */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .global-map-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            margin-bottom: 2.5rem;
            border: 1px solid var(--border);
        }

        #global-map {
            height: 450px;
            width: 100%;
            border-radius: 8px;
            z-index: 1;
        }

        /* Filtres */
        .filter-bar {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.25rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 1.25rem;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .filter-group select {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: white;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        /* Grille circuits */
        .circuits-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .circuit-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .circuit-header {
            padding: 1.5rem;
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .circuit-badge {
            background: var(--secondary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .circuit-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 0.4rem;
        }

        .circuit-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .circuit-map-container {
            height: 260px;
            width: 100%;
            background: #e2e8f0;
            z-index: 1;
        }

        .steps-container {
            padding: 1.5rem;
        }

        .steps-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--secondary);
        }

        /* Étapes Accordéon */
        .step-item {
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 1rem;
            overflow: hidden;
            background: white;
        }

        .step-header {
            padding: 1rem;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .step-header:hover {
            background: #f1f5f9;
        }

        .step-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .step-number {
            background: var(--primary);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .step-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
        }

        .step-price-tag {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-weight: 600;
        }

        .price-free {
            background: #dcfce7;
            color: #166534;
        }

        .price-paid {
            background: #fee2e2;
            color: #991b1b;
        }

        .toggle-icon {
            font-size: 1.1rem;
            transition: transform 0.3s;
            color: var(--text-muted);
        }

        .step-item.open .toggle-icon {
            transform: rotate(180deg);
        }

        .step-body {
            display: none;
            padding: 1.25rem;
            border-top: 1px solid var(--border);
            background: white;
        }

        .step-item.open .step-body {
            display: block;
        }

        .step-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .audio-player-bar {
            background: #f1f5f9;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
        }

        .audio-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .audio-btn.stop {
            background: #64748b;
        }

        .step-highlights {
            background: #eff6ff;
            border-left: 4px solid var(--secondary);
            padding: 0.8rem 1rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .step-highlights strong {
            color: var(--secondary);
            display: block;
            margin-bottom: 0.2rem;
        }

        .step-description {
            font-size: 0.95rem;
            color: #334155;
            line-height: 1.7;
            text-align: justify;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: var(--radius);
            color: var(--text-muted);
            border: 1px dashed var(--border);
        }
    </style>
</head>

            <div class="city-selector-bar">

                    <option value="paris">Paris (France)</option>
                    <option value="rome">Rome (Italie)</option>
                    <option value="barcelona">Barcelone (Espagne)</option>
                    <option value="amsterdam">Amsterdam (Pays-Bas)</option>
                    <option value="prague">Prague (République tchèque)</option>
                    <option value="vienna">Vienne (Autriche)</option>
                    <option value="berlin">Berlin (Allemagne)</option>
                    <option value="florence">Florence (Italie)</option>
                    <option value="venice">Venise (Italie)</option>

            </div>
        </div>

    <div class="container">

        </div>

        <div class="filter-bar">

            </div>
            <div class="filters">
                <div class="filter-group">
                    <label>Durée max :</label>
                    <select id="filter-duration" onchange="renderApp()">
                        <option value="all">Toutes</option>
                        <option value="2h">Jusqu'à 2h00</option>
                        <option value="3h">Jusqu'à 3h00</option>
                        <option value="4h">Jusqu'à 4h00</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Budget :</label>
                    <select id="filter-price" onchange="renderApp()">
                        <option value="all">Tous</option>
                        <option value="free">100% Gratuit</option>
                        <option value="paid">Payant inclus</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="circuits-grid" id="circuits-container"></div>
    </div>

                        steps: [
                            { name: "Palais de Schönbrunn", coords: [48.1845, 16.3122], price: "£24.00", isFree: false, image: "https://images.unsplash.com/photo-1516550893885-303ce5879a7e?auto=format&fit=crop&w=800&q=80", highlights: "Ancienne résidence impériale d'été, Gloriette.", description: "Somptueux palais baroque des Habsbourg entouré de jardins à la française monumentaux." },
                            { name: "Cathédrale Saint-Étienne (Stephansdom)", coords: [48.2085, 16.3731], price: "Gratuit / Toit payant", isFree: true, image: "https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=800&q=80", highlights: "Toit en tuiles vernissées, tour gothique.", description: "Chef-d'œuvre gothique au cœur du centre historique de Vienne." }
                        ]
                    }

            },
            berlin: {
                name: "Berlin",
                center: [52.5200, 13.4050],
                zoom: 13,
                circuits: [
                    {
                        id: "ber-1", title: "#1 Porte de Brandebourg & Île aux Musées", district: "Mitte", duration: "3h00", durationHours: 3.0, distance: "3.5 km", difficulty: "Facile", hasPaid: true, color: "#c8102e",
                        steps: [
                            { name: "Porte de Brandebourg", coords: [52.5163, 13.3777], price: "Gratuit", isFree: true, image: "https://images.unsplash.com/photo-1560969184-10fe8719e047?auto=format&fit=crop&w=800&q=80", highlights: "Symbole de la réunification allemande.", description: "Monument néoclassique le plus célèbre de Berlin, témoin de l'histoire mouvementée de la ville." },
                            { name: "Île aux Musées (Museumsinsel)", coords: [52.5169, 13.4010], price: "Musées dès £20", isFree: false, image: "https://images.unsplash.com/photo-1599940824399-b87987ceb72a?auto=format&fit=crop&w=800&q=80", highlights: "Cathédrale de Berlin, musées classés UNESCO.", description: "Ensemble muséal exceptionnel abritant des trésors archéologiques mondiaux sur les rives de la Spree." }
                        ]
                    }
                ]
            },
            florence: {
                name: "Florence",
                center: [43.7696, 11.2558],
                zoom: 14,
                circuits: [
                    {
                        id: "flo-1", title: "#1 Le Duomo & Galerie des Offices", district: "Centro Storico", duration: "3h30", durationHours: 3.5, distance: "3.0 km", difficulty: "Facile", hasPaid: true, color: "#c8102e",
                        steps: [
                            { name: "Cathédrale Santa Maria del Fiore (Le Duomo)", coords: [43.7731, 11.2560], price: "Gratuit / Dôme £25", isFree: true, image: "https://images.unsplash.com/photo-1543429776-2782fc8e1acd?auto=format&fit=crop&w=800&q=80", highlights: "Coupole de Brunelleschi, clocher de Giotto.", description: "Cathédrale emblématique de Florence dotée d'une immense coupole en terre cuite." },
                            { name: "Galerie des Offices", coords: [43.7687, 11.2553], price: "£25.00", isFree: false, image: "https://images.unsplash.com/photo-1525874684015-58379d421a52?auto=format&fit=crop&w=800&q=80", highlights: "Chefs-d'œuvre de Botticelli, Michel-Ange.", description: "L'un des musées d'art de la Renaissance les plus prestigieux au monde." }
                        ]
                    }
                ]
            },
            venice: {
                name: "Venice",
                center: [45.4408, 12.3155],
                zoom: 14,
                circuits: [
                    {
                        id: "ven-1", title: "#1 Place Saint-Marc & Palais des Doges", district: "San Marco", duration: "3h00", durationHours: 3.0, distance: "2.8 km", difficulty: "Facile", hasPaid: true, color: "#c8102e",
                        steps: [
                            { name: "Place Saint-Marc & Basilique", coords: [45.4343, 12.3388], price: "Gratuit / Basilique £6", isFree: true, image: "https://images.unsplash.com/photo-1514896851609-8902defb1d26?auto=format&fit=crop&w=800&q=80", highlights: "Mosaïques dorées, campanile.", description: "Célèbre place publique de Venise dominée par la somptueuse basilique byzantine." },
                            { name: "Palais des Doges", coords: [45.4337, 12.3392], price: "£30.00", isFree: false, image: "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?auto=format&fit=crop&w=800&q=80", highlights: "Pont des Soupirs, salles du Grand Conseil.", description: "Palais gothique somptueux, siège historique du pouvoir de la République de Venise." }
                        ]
                    }
                ]
            }
        };

        let currentCityKey = "london";
        let globalMap = null;
        let mapInstances = {};
        let synth = window.speechSynthesis;
        let currentUtterance = null;

        document.addEventListener("DOMContentLoaded", () => {
            renderApp();
        });

        function changeCity(cityKey) {
            currentCityKey = cityKey;
            renderApp();
        }

        function renderApp() {
            const city = citiesData[currentCityKey];
            document.getElementById("global-map-title").innerText = `📍 Carte globale des circuits de ${city.name}`;

            initGlobalMap(city);
            renderCircuitsGrid(city);
        }

        // Initialisation de la carte globale
        function initGlobalMap(city) {
            if (globalMap) {
                globalMap.remove();
            }

            globalMap = L.map('global-map').setView(city.center, city.zoom);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(globalMap);

            city.circuits.forEach(circuit => {
                const latLngs = circuit.steps.map(s => s.coords);
                
                L.polyline(latLngs, {
                    color: circuit.color,
                    weight: 4,
                    opacity: 0.8,
                    dashArray: '6, 6'
                }).addTo(globalMap);

                circuit.steps.forEach((step, idx) => {
                    L.circleMarker(step.coords, {
                        radius: 6,
                        fillColor: circuit.color,
                        color: '#ffffff',
                        weight: 2,
                        fillOpacity: 0.9
                    }).addTo(globalMap).bindPopup(`<b>${circuit.title}</b><br>${idx + 1}. ${step.name}`);
                });
            });
        }

        // Rendu des circuits
        function renderCircuitsGrid(city) {
            const container = document.getElementById('circuits-container');
            container.innerHTML = '';

            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const durationFilter = document.getElementById('filter-duration').value;
            const priceFilter = document.getElementById('filter-price').value;

            const filtered = city.circuits.filter(circuit => {
                const matchSearch = circuit.title.toLowerCase().includes(searchTerm) ||
                    circuit.district.toLowerCase().includes(searchTerm) ||
                    circuit.steps.some(s => s.name.toLowerCase().includes(searchTerm));

                if (!matchSearch) return false;
                if (durationFilter === '2h' && circuit.durationHours > 2.0) return false;
                if (durationFilter === '3h' && circuit.durationHours > 3.0) return false;
                if (durationFilter === '4h' && circuit.durationHours > 4.0) return false;
                if (priceFilter === 'free' && circuit.hasPaid) return false;
                if (priceFilter === 'paid' && !circuit.hasPaid) return false;

                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><h3>Aucun circuit ne correspond à vos critères pour ${city.name}.</h3></div>`;
                return;
            }

            filtered.forEach(circuit => {
                const card = document.createElement('div');
                card.className = 'circuit-card';
                card.id = `card-${circuit.id}`;

                let stepsHTML = circuit.steps.map((step, idx) => `
                    <div class="step-item" id="step-${circuit.id}-${idx}">
                        <div class="step-header" onclick="toggleStep('${circuit.id}', ${idx})">
                            <div class="step-header-left">
                                <span class="step-number">${idx + 1}</span>
                                <span class="step-name">${step.name}</span>
                                <span class="step-price-tag ${step.isFree ? 'price-free' : 'price-paid'}">${step.price}</span>
                            </div>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="step-body">
                            <img src="${step.image}" alt="${step.name}" class="step-image" loading="lazy">
                            
                            <div class="audio-player-bar">
                                <span>🎧 <strong>Guide Vocal</strong></span>
                                <div>
                                    <button class="audio-btn" onclick="playAudio('${step.name}', '${step.highlights}. ${step.description}')">🔊 Écouter</button>
                                    <button class="audio-btn stop" onclick="stopAudio()">⏹️ Stopper</button>
                                </div>
                            </div>

                            <div class="step-highlights">
                                <strong>💡 À ne pas manquer :</strong>
                                ${step.highlights}
                            </div>
                            <div class="step-description">
                                ${step.description}
                            </div>
                        </div>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="circuit-header">
                        <div>
                            <span class="circuit-badge">${circuit.district}</span>
                            <h2 class="circuit-title">${circuit.title}</h2>
                            <div class="circuit-meta">
                                <span>⏱️ ${circuit.duration}</span>
                                <span>🚶 ${circuit.distance}</span>
                                <span>📊 ${circuit.difficulty}</span>
                            </div>
                        </div>
                    </div>
                    <div class="circuit-map-container" id="map-${circuit.id}"></div>
                    <div class="steps-container">
                        <div class="steps-title">📍 Étapes détaillées :</div>
                        ${stepsHTML}
                    </div>
                `;
                container.appendChild(card);
            });

            setTimeout(() => {
                filtered.forEach(circuit => initIndividualMap(circuit));
            }, 100);
        }

        // Cartes individuelles
        function initIndividualMap(circuit) {
            const mapId = `map-${circuit.id}`;
            const mapElem = document.getElementById(mapId);
            if (!mapElem) return;

            if (mapInstances[mapId]) {
                mapInstances[mapId].remove();
            }

            const latLngs = circuit.steps.map(s => s.coords);
            const map = L.map(mapId, { scrollWheelZoom: false }).setView(latLngs[0], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            L.polyline(latLngs, { color: circuit.color, weight: 4, opacity: 0.9 }).addTo(map);

            circuit.steps.forEach((step, idx) => {
                const pin = L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background:${circuit.color};color:white;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-weight:bold;font-size:11px;border:2px solid white;">${idx + 1}</div>`,
                    iconSize: [22, 22],
                    iconAnchor: [11, 11]
                });
                L.marker(step.coords, { icon: pin }).addTo(map).bindPopup(`<b>${idx + 1}. ${step.name}</b>`);
            });

            map.fitBounds(L.polyline(latLngs).getBounds(), { padding: [25, 25] });
            mapInstances[mapId] = map;
        }

        function toggleStep(circuitId, idx) {
            document.getElementById(`step-${circuitId}-${idx}`).classList.toggle('open');
        }

        function playAudio(title, desc) {
            stopAudio();
            if ('speechSynthesis' in window) {
                currentUtterance = new SpeechSynthesisUtterance(`${title}. ${desc}`);
                currentUtterance.lang = 'fr-FR';
                currentUtterance.rate = 0.95;
                synth.speak(currentUtterance);
            }
        }

        function stopAudio() {
            if (synth && synth.speaking) synth.cancel();
        }
    </script>
</body>
